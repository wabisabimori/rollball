<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>コロコロめいろ</title>
<style>
  :root {
    --cyan: #4df3ff; --mag: #ff4fd8; --vio: #8b5cff; --ink: #e9f1ff; --dim: #8fa3c7;
    --glass: rgba(14, 20, 44, .62); --line: rgba(120, 200, 255, .28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: #05060f; color: var(--ink);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 8px) 10px 0;
    display: flex; gap: 6px; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .pill {
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px;
    font-weight: 700; font-size: 12px; letter-spacing: .12em; white-space: nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 18px rgba(77, 243, 255, .08), inset 0 1px 0 rgba(255,255,255,.06);
  }
  #stage { color: var(--cyan); }
  .timer {
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 18px; letter-spacing: .06em;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(77, 243, 255, .55);
  }
  #miss { font-size: 13px; letter-spacing: .04em; }
  #tools {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 10px calc(env(safe-area-inset-bottom) + 10px);
    display: flex; gap: 8px; justify-content: center;
  }
  button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; letter-spacing: .04em; white-space: nowrap;
    background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .08s, border-color .2s;
  }
  button:active { transform: scale(.96); border-color: var(--cyan); }
  #sound { width: 44px; padding: 10px 0; }
  button.primary {
    border: 0; color: #fff; font-size: 17px; padding: 13px 28px; letter-spacing: .18em;
    background: linear-gradient(100deg, var(--vio), var(--mag));
    box-shadow: 0 0 24px rgba(255, 79, 216, .45), inset 0 1px 0 rgba(255,255,255,.3);
  }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(3, 4, 14, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 16px;
  }
  #overlay.show { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: scale(.97); } }
  .card {
    position: relative; width: min(380px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y;
    background: linear-gradient(160deg, rgba(22, 28, 62, .92), rgba(10, 12, 30, .94));
    border: 1px solid var(--line); border-radius: 20px; padding: 22px 16px 16px; text-align: center;
    box-shadow: 0 0 0 1px rgba(139, 92, 255, .15), 0 0 40px rgba(77, 243, 255, .12), 0 20px 50px rgba(0,0,0,.6);
  }
  .card::before {
    content: ""; position: absolute; left: 20%; right: 20%; top: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--mag), transparent);
  }
  .card h1 {
    margin: 0; font-size: 28px; letter-spacing: .08em;
    background: linear-gradient(90deg, var(--cyan), #b9a2ff 50%, var(--mag)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(77, 243, 255, .35));
  }
  .card .sub { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .5em; color: var(--dim); margin: 2px 0 8px; }
  .card h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: .08em; color: var(--ink); }
  .card h2 .no { display: block; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .4em; color: var(--cyan); margin-bottom: 4px; }
  .card p { margin: 6px 0 12px; font-size: 13px; line-height: 1.7; color: #c9d6f2; }
  .card .big {
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 36px; font-weight: 700; margin: 6px 0;
    color: #fff; text-shadow: 0 0 16px rgba(77, 243, 255, .7); font-variant-numeric: tabular-nums;
  }
  .card .new { color: var(--mag); font-weight: 800; text-shadow: 0 0 10px rgba(255, 79, 216, .6); }
  .card .tip { background: rgba(77, 243, 255, .07); border: 1px solid rgba(77, 243, 255, .2); border-radius: 12px; padding: 10px 12px; color: var(--ink); }
  .card .btns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 12px; }
  .card .btns.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stage-btn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; letter-spacing: .02em; }
  .stage-btn .no { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .25em; color: var(--cyan); }
  .stage-btn small { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-weight: 500; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .stage-btn.done { border-color: rgba(255, 79, 216, .45); }
  .stage-btn.done small { color: var(--mag); }
  .note { font-size: 11px; color: var(--dim); margin-top: 10px; letter-spacing: .04em; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #05060f; color: var(--ink); font-size: 18px; font-weight: 700; z-index: 10; letter-spacing: .1em;
  }
  @media (orientation: landscape) and (max-height: 500px) { #rotate { display: flex; } }
</style>
</head>

    open: 'lr',

  },
  {
    id: 'cats2', name: 'ねこまっしぐら', lives: 5,
    tip: 'ねこが2ひき！トゲ鉄球もいるよ',
    start: [2, 1.8], goal: [10.4, 16.4],
    walls: [V(4, 0, 13), V(8, 5, 18)],
    holes: [[2.9, 9.5, .5], [5.2, 6.5, .6], [6.8, 14.8, .55], [9.4, 12.5, .55], [10.6, 6.8, .55]],
    enemies: [{ t: 'patrol', a: [2.1, 4], b: [2.1, 11.5], s: 2.2 }],
    cats: [
      { x: 6, y: 10, wake: 3.8, speed: 3.2, chase: 4.5, rest: 2.2 },
      { x: 10, y: 9, wake: 3.8, speed: 3.2, chase: 4.5, rest: 2.2 },
    ],
  },
  {
    id: 'final', name: 'さいごのしれん', lives: 7,
    tip: 'ぜんぶ入り！ねこ・扇風機・トゲ・がけ。<br>がんばれ！',
    open: 'lr',
    start: [6, 16.6], goal: [6, 2.4],
    walls: [H(12, 0, 4.5), H(12, 7.5, 12), [5, 8.2, 2, 1.2], H(5.5, 2.5, 9.5)],
    holes: [[2.8, 15, .6], [2.5, 10.8, .6], [9.5, 10.8, .6], [1.6, 2, .5], [10.4, 2, .5]],
    enemies: [
      { t: 'patrol', a: [1.2, 6.8], b: [10.8, 6.8], s: 2.8 },
      { t: 'orbit', c: [6, 2.6], r: 1.7, s: 1.3 },
    ],
    fans: [
      { x: 4.85, y: 8.8, dir: [-1, 0], len: 5.2, w: 1.6, power: 22, period: 3.2, on: 1.7, phase: 0 },
      { x: 7.15, y: 8.8, dir: [1, 0], len: 5.2, w: 1.6, power: 22, period: 3.2, on: 1.7, phase: 1.6 },
    ],
    cats: [{ x: 9.5, y: 15.2, wake: 3.6, speed: 3.0, chase: 4, rest: 2.5 }],
  },
  // ---- ここから 2つのボール（balls: 各ボールのスタートと専用ゴール） ----
  {
    id: 'twin', name: 'ふたごのボール', lives: 5,
    tip: 'ボールが2つ！<span style="color:#e8456a">ピンク</span>と<span style="color:#2f8fe0">ブルー</span>を<br>同じ色のゴールに入れよう。<br>ゴールしたボールはそこで待っててくれるよ',
    balls: [{ start: [1.5, 16.5], goal: [4.5, 1.5] }, { start: [10.5, 1.5], goal: [7.5, 16.5] }],
    walls: [V(6, 0, 18), H(12, 0, 4), H(6, 2, 6), H(6, 8, 12), H(12, 6, 10)],
    holes: [[3, 9, .55], [9, 9, .55], [2.2, 14.6, .5], [9.8, 3.4, .5]],
  },
  {
    id: 'cross', name: 'すれちがいの道', lives: 5,
    tip: '2つのボールが入れかわるよ。<br>ボール同士はぶつかるので気をつけて',
    balls: [{ start: [2, 16.5], goal: [10, 1.5] }, { start: [10, 16.5], goal: [2, 1.5] }],
    walls: [H(13, 3.5, 8.5), V(6, 5, 13), H(5, 0, 4.5), H(5, 7.5, 12)],
    holes: [[6, 15.3, .6], [3, 9, .55], [9, 9, .55], [6, 2.8, .6], [1.4, 11.5, .45], [10.6, 6.6, .45]],
  },
  {
    id: 'lure', name: 'ねこをおびきよせろ', lives: 4,
    tip: 'がけ・ねこ・ボール2つ。<br>ねこは近いほうのボールを追いかけて、<br>疲れたらその場で寝ちゃうよ。<br>片方をおとりにしてみよう！',
    open: 'lr',
    balls: [{ start: [2, 16.5], goal: [9.5, 8.5] }, { start: [10, 16.5], goal: [2.5, 8.5] }],
    walls: [V(6, 6, 18), H(14, 2.5, 6), H(14, 6, 9.5)],
    holes: [[2.5, 11.6, .55], [9.5, 11.6, .55], [4, 3.8, .5], [8, 3.8, .5], [4.3, 16, .45], [7.7, 16, .45]],
    cats: [{ x: 6, y: 2.4, wake: 3.4, speed: 2.9, chase: 4, rest: 2.5 }],
  },
];
// ステージの並び（難易度順）。並べ替えはここを入れ替えるだけ
const ORDER = ['basic', 'edge', 'fan', 'cat', 'twin', 'zigzag', 'spikes', 'cross', 'cliff', 'storm', 'cats2', 'lure', 'final'];
const LEVELS = ORDER.map(id => LEVEL_DEFS.find(l => l.id === id));
// ボールの色（1つだけのステージはシアン、2つのときはピンクとブルー）
const PAL_SOLO = { hi: '#ffffff', mid: '#c8fbff', lo: '#35b6d6', edge: '#0f4a66', glow: '#4df3ff', rgb: '77,243,255' };
const PALS = [
  { hi: '#fff2fa', mid: '#ffb3dc', lo: '#ff4fa8', edge: '#8a1356', glow: '#ff5fb4', rgb: '255,95,180' },
  { hi: '#eef6ff', mid: '#b3d4ff', lo: '#4d8dff', edge: '#14307a', glow: '#5c9dff', rgb: '92,157,255' },
];

// ===== 要素 =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const elStage = $('stage'), elTime = $('time'), elMiss = $('miss');
const overlay = $('overlay'), card = $('card');

// ===== 状態 =====
let level = 0, L = LEVELS[0], walls = [], open = '';
let state = 'menu';         // menu | ready | play | falling | clear
let time = 0, clock = 0, misses = 0;
// ボール: { x, y, vx, vy, sx, sy, alpha, inv, start, goal, pal, done, fall }
// fall = { kind: hole|goal|edge|squash, x, y, t, sx, sy }
let balls = [];
let enemies = [], fans = [], cats = [];
let particles = [], texts = [];
let anim = 0;

// ===== 入力（ジャイロ／キーボード／ドラッグ） =====
const sensor = { has: false, beta: 0, gamma: 0, b0: null, g0: 0, listening: false };
const tilt = { x: 0, y: 0 }, target = { x: 0, y: 0 };
const keys = new Set();
let drag = null;
const SENS = 1.0;

function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  sensor.has = true;
  sensor.beta = e.beta; sensor.gamma = e.gamma;
  if (sensor.b0 == null) calibrate();
}
function calibrate() { sensor.b0 = sensor.beta; sensor.g0 = sensor.gamma; }
function enableSensors() {
  // iOS は「ユーザー操作の中で」許可をリクエストする必要がある
  let p = Promise.resolve('granted');
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      p = DeviceOrientationEvent.requestPermission();
    }
  } catch (e) {}
  return p.catch(() => 'denied').then(res => {
    if (res === 'granted' && !sensor.listening) {
      window.addEventListener('deviceorientation', onOrientation);
      sensor.listening = true;
    }
    return res;
  });
}
addEventListener('keydown', e => keys.add(e.key));
addEventListener('keyup', e => keys.delete(e.key));
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 }; });
addEventListener('pointermove', e => { if (drag) { drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y; } });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointercancel', () => { drag = null; });

function readInput() {
  const clamp1 = v => Math.max(-0.75, Math.min(0.75, v));
  let tx = 0, ty = 0, any = false;
  if (keys.has('ArrowLeft') || keys.has('a')) { tx -= .55; any = true; }
  if (keys.has('ArrowRight') || keys.has('d')) { tx += .55; any = true; }
  if (keys.has('ArrowUp') || keys.has('w')) { ty -= .55; any = true; }
  if (keys.has('ArrowDown') || keys.has('s')) { ty += .55; any = true; }
  if (!any && drag && !sensor.has) { tx = drag.dx / 120; ty = drag.dy / 120; any = true; }
  if (!any && sensor.has) {
    const d2r = Math.PI / 180, lim = v => Math.max(-60, Math.min(60, v));
    tx = Math.sin(lim(sensor.gamma - sensor.g0) * d2r) * SENS;
    ty = Math.sin(lim(sensor.beta - sensor.b0) * d2r) * SENS;
  }

// ===== サウンド（WebAudio でその場で合成） =====
let ac = null, master = null, noiseBuf = null;
let muted = localStorage.getItem('rollball_mute') === '1';
function audio() {
  // iPhone のマナーモードでも鳴るようにする（Safari 16.4+）
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master = ac.createGain(); master.gain.value = muted ? 0 : 1;
      master.connect(comp).connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);   // iOS のロック解除
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type = 'sine', vol = .15, f2 = null, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .005);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .03);
}
function noise(dur, vol, ftype, f, f2 = null, delay = 0, q = 1) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; fl.type = ftype; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .03);
}

// ===== レイアウト & 盤面のプリレンダリング =====
let dpr = 1, S = 30, OX = 0, OY = 0;
let boardC = null, wallC = null;
const DEPTH = 0.24;   // 壁の高さ（見た目）

let bgC = null, stars = [];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const top = $('hud').getBoundingClientRect().bottom + 14;
  const bottom = $('tools').getBoundingClientRect().top - 14;
  const availW = innerWidth - 28, availH = bottom - top;
  S = Math.max(8, Math.min(availW / (COLS + 0.8), availH / (ROWS + 0.8)));
  OX = (innerWidth - COLS * S) / 2;
  OY = top + (availH - ROWS * S) / 2;
  buildBackground();
  buildLayers();
}

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// 宇宙の背景（星雲＋かすかな星）。またたく星は毎フレーム描く
function buildBackground() {
  const W = innerWidth + 60, Hh = innerHeight + 60;
  bgC = document.createElement('canvas'); bgC.width = W * dpr; bgC.height = Hh * dpr;
  const g = bgC.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#04050d'; g.fillRect(0, 0, W, Hh);
  const neb = (x, y, r, col) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, Hh);
  };
  neb(W * .15, Hh * .2, W * .7, 'rgba(110, 60, 220, .28)');
  neb(W * .9, Hh * .75, W * .8, 'rgba(20, 140, 200, .22)');
  neb(W * .7, Hh * .1, W * .45, 'rgba(255, 60, 170, .14)');
  const rnd = rng(7);
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(${200 + rnd() * 55},${210 + rnd() * 45},255,${.15 + rnd() * .45})`;
    g.fillRect(rnd() * W, rnd() * Hh, rnd() < .9 ? .8 : 1.4, rnd() < .9 ? .8 : 1.4);
  }
  stars = Array.from({ length: 50 }, () => ({ x: rnd() * W, y: rnd() * Hh, r: .6 + rnd() * 1.3, ph: rnd() * 6, sp: .8 + rnd() * 2, d: .3 + rnd() }));
}

function buildLayers() {
  const w = Math.ceil(COLS * S * dpr), h = Math.ceil(ROWS * S * dpr), k = S * dpr;
  boardC = document.createElement('canvas'); boardC.width = w; boardC.height = h;
  wallC = document.createElement('canvas'); wallC.width = w; wallC.height = h;

  // --- 床（宇宙ステーションの金属パネル） ---
  const b = boardC.getContext('2d');
  b.setTransform(k, 0, 0, k, 0, 0);
  const floor = b.createLinearGradient(0, 0, COLS * .4, ROWS);
  floor.addColorStop(0, '#141b3d'); floor.addColorStop(1, '#0a0f26');
  b.fillStyle = floor; b.fillRect(0, 0, COLS, ROWS);
  const rnd = rng(level * 977 + 13);
  // パネルの濃淡
  for (let y = 0; y < ROWS; y += 3) for (let x = 0; x < COLS; x += 3) {
    b.fillStyle = `rgba(${rnd() < .5 ? '120,160,255' : '0,0,0'},${.02 + rnd() * .04})`;
    b.fillRect(x, y, 3, 3);
  }
  // グリッド
  b.lineWidth = .02; b.strokeStyle = 'rgba(110,170,255,.07)';
  b.beginPath();
  for (let x = 1; x < COLS; x++) { b.moveTo(x, 0); b.lineTo(x, ROWS); }
  for (let y = 1; y < ROWS; y++) { b.moveTo(0, y); b.lineTo(COLS, y); }
  b.stroke();
  b.lineWidth = .035; b.strokeStyle = 'rgba(110,190,255,.14)';
  b.beginPath();
  for (let x = 3; x < COLS; x += 3) { b.moveTo(x, 0); b.lineTo(x, ROWS); }
  for (let y = 3; y < ROWS; y += 3) { b.moveTo(0, y); b.lineTo(COLS, y); }
  b.stroke();
  // リベット
  b.fillStyle = 'rgba(160,200,255,.18)';
  for (let y = 3; y < ROWS; y += 3) for (let x = 3; x < COLS; x += 3) {
    for (const [dx, dy] of [[-.2, -.2], [.2, -.2], [-.2, .2], [.2, .2]]) { b.beginPath(); b.arc(x + dx, y + dy, .04, 0, Math.PI * 2); b.fill(); }
  }

  // --- 穴（ブラックホールの芯） ---
  for (const [x, y, r] of L.holes) {
    const g = b.createRadialGradient(x, y, 0, x, y, r * 1.25);
    g.addColorStop(0, '#000'); g.addColorStop(.62, '#000'); g.addColorStop(.8, 'rgba(60,20,90,.9)'); g.addColorStop(1, 'rgba(60,20,90,0)');
    b.fillStyle = g; b.beginPath(); b.arc(x, y, r * 1.25, 0, Math.PI * 2); b.fill();
  }
  // --- ゴール（ワープゲートの土台） ---
  for (const bl of balls) {
    const [x, y] = bl.goal;
    const g = b.createRadialGradient(x, y, 0, x, y, .66);
    g.addColorStop(0, '#02030a'); g.addColorStop(.8, '#0a0f26'); g.addColorStop(1, `rgba(${bl.pal.rgb},.5)`);
    b.fillStyle = g; b.beginPath(); b.arc(x, y, .66, 0, Math.PI * 2); b.fill();
  }

  // --- 壁の影 ---
  b.save();
  b.shadowColor = 'rgba(0,0,0,.7)'; b.shadowBlur = 6 * dpr;
  b.shadowOffsetX = .08 * k; b.shadowOffsetY = .2 * k;
  b.fillStyle = '#000';
  for (const r of walls) b.fillRect(r[0], r[1] - DEPTH, r[2], r[3] + DEPTH);
  b.restore();

  // --- 壁（側面 → 上面 → ネオンの縁） ---
  const c = wallC.getContext('2d');
  c.setTransform(k, 0, 0, k, 0, 0);
  for (const r of walls) {
    const g = c.createLinearGradient(0, r[1] + r[3] - DEPTH, 0, r[1] + r[3]);
    g.addColorStop(0, '#1a2250'); g.addColorStop(1, '#0c1130');
    c.fillStyle = g; c.fillRect(r[0], r[1] - DEPTH, r[2], r[3] + DEPTH);
  }
  for (const r of walls) {
    const g = c.createLinearGradient(r[0], r[1] - DEPTH, r[0] + r[2] * .3, r[1] - DEPTH + r[3]);
    g.addColorStop(0, '#36437e'); g.addColorStop(1, '#232d5e');
    c.fillStyle = g; c.fillRect(r[0], r[1] - DEPTH, r[2], r[3]);
  }
  c.save();
  c.shadowColor = 'rgba(77,243,255,.9)'; c.shadowBlur = 5 * dpr;
  c.strokeStyle = 'rgba(120,240,255,.85)'; c.lineWidth = .035;
  for (const r of walls) c.strokeRect(r[0] + .04, r[1] - DEPTH + .04, r[2] - .08, r[3] - .08);
  c.restore();
  // 側面の発光ライン
  c.fillStyle = 'rgba(139,92,255,.55)';
  for (const r of walls) c.fillRect(r[0] + .06, r[1] + r[3] - .06, r[2] - .12, .025);
}

// ===== 衝突（ボール・ねこ共通） =====
// 円 b（半径 rad）を矩形 r から押し出す。E=反発係数。衝突の強さを返す
function pushRect(b, rad, r, E) {
  const cx = Math.max(r[0], Math.min(b.x, r[0] + r[2]));
  const cy = Math.max(r[1], Math.min(b.y, r[1] + r[3]));
  const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
  if (d2 >= rad * rad) return 0;
  let nx, ny;
  if (d2 < 1e-10) {   // 中心が壁の中 → 一番浅い方向へ押し出し
    const l = b.x - r[0], rr = r[0] + r[2] - b.x, t = b.y - r[1], bb = r[1] + r[3] - b.y;
    const m = Math.min(l, rr, t, bb);
    if (m === l) { nx = -1; ny = 0; b.x = r[0] - rad; }
    else if (m === rr) { nx = 1; ny = 0; b.x = r[0] + r[2] + rad; }
    else if (m === t) { nx = 0; ny = -1; b.y = r[1] - rad; }
    else { nx = 0; ny = 1; b.y = r[1] + r[3] + rad; }
  } else {
    const d = Math.sqrt(d2); nx = dx / d; ny = dy / d;
    b.x = cx + nx * rad; b.y = cy + ny * rad;
  }
  return bounce(b, nx, ny, E);
}
function pushCircle(b, rad, cx, cy, cr, E) {
  const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy), m = rad + cr;
  if (d >= m || d < 1e-6) return 0;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * m; b.y = cy + ny * m;
  return bounce(b, nx, ny, E);
}
function bounce(b, nx, ny, E) {
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return 0;
  b.vx -= (1 + E) * vn * nx; b.vy -= (1 + E) * vn * ny;
  return -vn;
}

// ===== ミス・ゴール演出 =====
function startFall(b, kind, x, y) {
  b.fall = { kind, x, y, t: 0, sx: b.x, sy: b.y };
  if (kind === 'goal') sfx.goal();
  else if (kind === 'squash') { sfx.squash(); vib([60, 30, 60]); texts.push({ x, y: y - .8, s: 'ペシャッ', life: 1 }); }
  else if (kind === 'edge') { sfx.edge(); vib(60); }
  else { sfx.hole(); vib(60); }
}

// ===== 物理 =====
function windAt(x, y) {
  let ax = 0, ay = 0;
  for (const f of fans) {
    if (!f.active) continue;
    const dx = x - f.x, dy = y - f.y;
    const along = dx * f.dir[0] + dy * f.dir[1];
    const across = Math.abs(-dx * f.dir[1] + dy * f.dir[0]);
    if (along > 0 && along < f.len && across < f.w / 2) {
      const k = f.power * (1 - .45 * along / f.len);
      ax += f.dir[0] * k; ay += f.dir[1] * k;
    }
  }
  return [ax, ay];
}

function physics(dt) {
  const G = 38, SUB = 4, h = dt / SUB;
  const live = liveBalls();
  for (let s = 0; s < SUB; s++) {
    for (const ball of live) {
      let ax = tilt.x * G, ay = tilt.y * G;
      // 穴のふちでは中心へ引き込まれる
      for (const [hx, hy, hr] of L.holes) {
        const dx = hx - ball.x, dy = hy - ball.y, d = Math.hypot(dx, dy);
        if (d < hr && d > 1e-4) { ax += dx / d * 22; ay += dy / d * 22; }
      }
      const [wx, wy] = windAt(ball.x, ball.y);
      ax += wx; ay += wy;
      ball.vx += ax * h; ball.vy += ay * h;
      const damp = Math.exp(-0.9 * h); ball.vx *= damp; ball.vy *= damp;
      const sp = Math.hypot(ball.vx, ball.vy), MAX = 22;
      if (sp > MAX) { ball.vx *= MAX / sp; ball.vy *= MAX / sp; }
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      for (const r of walls) knock(pushRect(ball, R, r, .35));
      for (const f of fans) knock(pushCircle(ball, R, f.x, f.y, .42, .35));
      // ちがう色のゴールはふさがっている
      for (const o of balls) if (o !== ball) knock(pushCircle(ball, R, o.goal[0], o.goal[1], .5, .35));
    }
    // ボール同士の衝突
    for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) collideBalls(live[i], live[j]);
  }
  for (const ball of live) checkBall(ball);
}

function collideBalls(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d >= 2 * R || d < 1e-6) return;
  const nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
  a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
  const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rel >= 0) return;
  const imp = -(1 + .6) * rel / 2;
  a.vx -= nx * imp; a.vy -= ny * imp; b.vx += nx * imp; b.vy += ny * imp;
  if (-rel > 1) sfx.clack(-rel);
}

function checkBall(ball) {
  // ゴール
  const [gx, gy] = ball.goal;
  if (Math.hypot(gx - ball.x, gy - ball.y) < .62 - R * .3) return startFall(ball, 'goal', gx, gy);
  // 穴
  for (const [hx, hy, hr] of L.holes) {
    if (Math.hypot(hx - ball.x, hy - ball.y) < hr - R * .35) return startFall(ball, 'hole', hx, hy);
  }
  // 盤の外へ
  const out = (open.includes('l') && ball.x < 0) ? [-1, 0] : (open.includes('r') && ball.x > COLS) ? [1, 0]
            : (open.includes('t') && ball.y < 0) ? [0, -1] : (open.includes('b') && ball.y > ROWS) ? [0, 1] : null;
  if (out) return startFall(ball, 'edge', ball.x + out[0] * 1.2, ball.y + out[1] * 1.2 + .6);
  if (ball.inv > 0) return;
  // トゲトゲ
  for (const e of enemies) {
    if (Math.hypot(e.x - ball.x, e.y - ball.y) < R + .42) return hitSpike(ball);
  }
  // ねこ
  for (const c of cats) {
    if (c.st === 'chase' && Math.hypot(c.x - ball.x, c.y - ball.y) < R + .42) {
      c.st = 'pounce'; c.timer = .9; c.x += (ball.x - c.x) * .4; c.y += (ball.y - c.y) * .4;
      return startFall(ball, 'squash', ball.x, ball.y);
    }
  }
}

function hitSpike(ball) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
    particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .6, c: i % 2 ? '#ff3b6b' : '#ffd0dc' });
  }
  sfx.zap(); vib([40, 30, 40]);
  addMiss(ball);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    e.rot += dt * 3;
    if (e.t === 'patrol') {
      const len = Math.hypot(e.b[0] - e.a[0], e.b[1] - e.a[1]);
      e.p += e.dir * e.s * dt / len;
      if (e.p > 1) { e.p = 1; e.dir = -1; } else if (e.p < 0) { e.p = 0; e.dir = 1; }
      const q = e.p * e.p * (3 - 2 * e.p);   // 端でゆっくり
      e.x = e.a[0] + (e.b[0] - e.a[0]) * q; e.y = e.a[1] + (e.b[1] - e.a[1]) * q;
    } else {
      e.p += e.s * dt;
      e.x = e.c[0] + Math.cos(e.p) * e.r; e.y = e.c[1] + Math.sin(e.p) * e.r;
    }
  }
}

function fanPhase(f) {   // 0..period 内の位置
  return f.period ? ((clock + (f.phase || 0)) % f.period + f.period) % f.period : 0;
}
function updateFans(dt) {
  for (const f of fans) {
    f.active = !f.period || fanPhase(f) < f.on;
    f.vis += ((f.active ? 1 : 0) - f.vis) * Math.min(1, dt * 6);
    f.spd += ((f.active ? 22 : 1) - f.spd) * Math.min(1, dt * 3);
    f.spin += f.spd * dt;
    if (f.active) {
      for (const s of f.streaks) {
        s.a += dt * (5 + f.power * .3);
        if (s.a > f.len) { s.a = .4; s.c = (Math.random() - .5) * f.w; }
      }
    }
  }
}

function moveCatToward(c, tx, ty, speed, dt) {
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, dt * 6);
  c.vx += (dx / d * speed - c.vx) * k; c.vy += (dy / d * speed - c.vy) * k;
  c.x += c.vx * dt; c.y += c.vy * dt;
  for (const r of walls) pushRect(c, .38, r, 0);
  for (const [hx, hy, hr] of L.holes) pushCircle(c, .3, hx, hy, hr, 0);
  for (const f of fans) pushCircle(c, .38, f.x, f.y, .42, 0);
  c.x = Math.max(.45, Math.min(COLS - .45, c.x)); c.y = Math.max(.45, Math.min(ROWS - .45, c.y));
  if (Math.abs(c.vx) > .3) c.face = c.vx > 0 ? 1 : -1;
}
function updateCats(dt) {
  const live = liveBalls();
  for (const c of cats) {
    // いちばん近いボールをねらう
    let ball = null, d = Infinity;
    for (const b of live) { const dd = Math.hypot(b.x - c.x, b.y - c.y); if (dd < d) { d = dd; ball = b; } }
    const active = state === 'play' && ball && ball.inv <= 0;
    if (!ball) ball = { x: c.x, y: c.y };
    c.timer -= dt;
    switch (c.st) {
      case 'sleep':
        c.vx = c.vy = 0;
        if (active && d < c.wake) { c.st = 'alert'; c.timer = .6; meow(); texts.push({ x: c.x, y: c.y - .9, s: '!', life: .7, col: '#ff4d6d' }); }
        break;
      case 'alert':
        c.face = ball.x > c.x ? 1 : -1;
        if (c.timer <= 0) { c.st = 'chase'; c.timer = c.chase; }
        break;
      case 'chase':
        moveCatToward(c, ball.x, ball.y, c.speed, dt);
        if (c.timer <= 0 || d > c.wake * 2.4 || state !== 'play') { c.st = 'tired'; c.timer = c.rest; }
        break;
      case 'tired':
        c.vx *= .9; c.vy *= .9;
        if (c.timer <= 0) {
          // おうちには帰らず、その場でまた寝る（＝誘導できる）
          if (active && d < c.wake) { c.st = 'alert'; c.timer = .5; meow(); texts.push({ x: c.x, y: c.y - .9, s: '!', life: .7, col: '#ff4d6d' }); }
          else c.st = 'sleep';
        }
        break;
      case 'pounce':
        if (c.timer <= 0) { c.st = 'tired'; c.timer = c.rest; }
        break;
    }
  }
}

function update(dt) {
  readInput();
  const k = 1 - Math.exp(-dt * 18);
  tilt.x += (target.x - tilt.x) * k; tilt.y += (target.y - tilt.y) * k;
  anim += dt;
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= dt * .6; }
  texts = texts.filter(t => t.life > 0);

  if (state === 'play') {
    time += dt; clock += dt;
    updateEnemies(dt); updateFans(dt); updateCats(dt);
    for (const b of balls) b.inv -= dt;
    physics(dt);
    for (const b of balls) if (b.fall) animateFall(b, dt);
    for (const b of balls) {   // 光の尾
      if (b.done) continue;
      b.trail.push([b.x, b.y]); if (b.trail.length > 9) b.trail.shift();
    }
    if (state === 'play' && balls.every(b => b.done)) clearLevel();
  }
  updateHud();
}

function animateFall(ball, dt) {
  const fall = ball.fall;
  fall.t += dt;
  if (fall.kind === 'squash') {
    const T = .7, u = Math.min(1, fall.t / T), e = Math.min(1, u * 4);
    ball.sx = 1 + .55 * e; ball.sy = 1 - .7 * e;
    if (u >= 1) { addMiss(ball); }
    return;
  }
  const T = fall.kind === 'edge' ? .55 : .45, u = Math.min(1, fall.t / T), e = u * u;
  ball.x = fall.sx + (fall.x - fall.sx) * Math.min(1, u * 2);
  ball.y = fall.sy + (fall.y - fall.sy) * Math.min(1, u * 2);
  if (fall.kind === 'goal') {
    ball.sx = ball.sy = 1 - .3 * e;
    if (u >= 1) {
      ball.fall = null; ball.done = true; ball.vx = ball.vy = 0;
      if (balls.some(b => !b.done)) { tone(1046, .18, 'triangle', .12); tone(1318, .22, 'triangle', .12, null, .08); vib(25); }
    }
    return;
  }
  ball.sx = ball.sy = 1 - .65 * e; ball.alpha = 1 - e * .9;
  if (u >= 1) { addMiss(ball); }
}

// ===== 描画 =====
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawStar(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}
function glowDot(c, x, y, r, rgb, a) {   // やわらかい光
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}
function textAt(x, y, s, size, col = '#fff') {   // 盤面座標にピクセル基準で文字を描く
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `800 ${Math.round(size * S)}px "Hiragino Sans", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(2, S * .12); ctx.strokeStyle = 'rgba(5,8,25,.9)'; ctx.lineJoin = 'round';
  const px = OX + x * S, py = OY + y * S;
  ctx.shadowColor = col; ctx.shadowBlur = 8;
  ctx.strokeText(s, px, py); ctx.fillStyle = col; ctx.fillText(s, px, py);
  ctx.restore();
}

function drawBackground() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const px = -30 - tilt.x * 18, py = -30 - tilt.y * 18;   // かたむきで少しずれる（奥行き感）
  ctx.drawImage(bgC, px, py, innerWidth + 60, innerHeight + 60);
  for (const s of stars) {
    const a = .35 + .65 * (.5 + .5 * Math.sin(anim * s.sp + s.ph));
    const x = s.x + px * s.d, y = s.y + py * s.d;
    ctx.fillStyle = `rgba(220,235,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
    if (s.r > 1.5) { ctx.fillStyle = `rgba(160,220,255,${a * .25})`; ctx.fillRect(x - s.r * 3, y - .3, s.r * 6, .6); ctx.fillRect(x - .3, y - s.r * 3, .6, s.r * 6); }
  }
}

function drawBlackHole(c, x, y, r, seed) {
  const t = anim * (1.2 + seed * .3);
  c.save(); c.translate(x, y);
  glowDot(c, 0, 0, r * 1.5, '150,70,255', .22);
  c.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const rr = r * (.72 + i * .16), a0 = t * (1 - i * .2) + i * 2.1 + seed;
    c.lineWidth = .05 - i * .01;
    c.strokeStyle = i === 0 ? 'rgba(255,170,90,.85)' : i === 1 ? 'rgba(255,90,200,.6)' : 'rgba(140,110,255,.45)';
    c.beginPath(); c.arc(0, 0, rr, a0, a0 + 2.2); c.stroke();
    c.beginPath(); c.arc(0, 0, rr, a0 + Math.PI, a0 + Math.PI + 1.4); c.stroke();
  }
  c.fillStyle = '#000'; c.beginPath(); c.arc(0, 0, r * .6, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,200,140,.55)'; c.lineWidth = .025;
  c.beginPath(); c.arc(0, 0, r * .6, 0, Math.PI * 2); c.stroke();
  c.restore();
}

function drawGate(c, b, pulse) {
  const [x, y] = b.goal, p = b.pal;
  c.save(); c.translate(x, y);
  glowDot(c, 0, 0, 1.0, p.rgb, .35);
  c.lineCap = 'round';
  c.strokeStyle = p.glow; c.lineWidth = .06;
  for (let i = 0; i < 4; i++) { const a = anim * 1.6 + i * Math.PI / 2; c.beginPath(); c.arc(0, 0, .56, a, a + .9); c.stroke(); }
  c.strokeStyle = `rgba(${p.rgb},.5)`; c.lineWidth = .025;
  for (let i = 0; i < 6; i++) { const a = -anim * 2.4 + i * Math.PI / 3; c.beginPath(); c.arc(0, 0, .42, a, a + .5); c.stroke(); }
  c.shadowColor = p.glow; c.shadowBlur = 10;
  c.fillStyle = '#fff'; c.strokeStyle = p.glow; c.lineWidth = .04;
  drawStar(c, 0, 0, .25 * pulse, anim * .6); c.fill(); c.stroke();
  c.restore();
}

function drawBall(c, ball, pulse) {
  const p = ball.pal;
  // 光の尾
  if (ball.trail.length > 1 && !ball.done) {
    for (let i = 0; i < ball.trail.length; i++) {
      const [tx, ty] = ball.trail[i], a = (i + 1) / ball.trail.length;
      c.fillStyle = `rgba(${p.rgb},${a * .18 * ball.alpha})`;
      c.beginPath(); c.arc(tx, ty, R * (.4 + .5 * a) * Math.min(ball.sx, 1), 0, Math.PI * 2); c.fill();
    }
  }
  const blink = !ball.done && !ball.fall && ball.inv > 0 && state === 'play';
  c.globalAlpha = ball.alpha * (blink ? (Math.sin(anim * 30) > 0 ? 1 : .4) : 1);
  glowDot(c, ball.x, ball.y, R * 2.2 * Math.max(ball.sx, ball.sy), p.rgb, .35);
  if (!ball.done && (!ball.fall || ball.fall.kind === 'squash')) {
    c.fillStyle = 'rgba(0,0,0,.45)';
    c.beginPath(); c.ellipse(ball.x + .1, ball.y + .2, R * .9 * ball.sx, R * .6, 0, 0, Math.PI * 2); c.fill();
  }
  c.save(); c.translate(ball.x, ball.y); c.scale(ball.sx, ball.sy);
  const g = c.createRadialGradient(-R * .35, -R * .4, R * .05, 0, 0, R);
  g.addColorStop(0, p.hi); g.addColorStop(.3, p.mid); g.addColorStop(.82, p.lo); g.addColorStop(1, p.edge);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fill();
  c.strokeStyle = `rgba(255,255,255,.35)`; c.lineWidth = .02;
  c.beginPath(); c.ellipse(0, 0, R * .98, R * .35, -.4, 0, Math.PI * 2); c.stroke();   // 惑星のリング風
  c.restore();
  if (ball.done && balls.length > 1) {
    c.fillStyle = '#fff'; drawStar(c, ball.x, ball.y, .16 * pulse, 0); c.fill();
  }
  c.globalAlpha = 1;
}

function drawEnemy(c, e) {   // 宇宙機雷
  c.fillStyle = 'rgba(0,0,0,.45)';
  c.beginPath(); c.ellipse(e.x + .1, e.y + .18, .45, .3, 0, 0, Math.PI * 2); c.fill();
  const blink = .5 + .5 * Math.sin(anim * 8 + e.rot);
  glowDot(c, e.x, e.y, .9, '255,50,90', .18 + blink * .15);
  c.save(); c.translate(e.x, e.y); c.rotate(e.rot);
  c.fillStyle = '#ff3b6b'; c.strokeStyle = 'rgba(255,170,190,.8)'; c.lineWidth = .025;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    c.beginPath();
    c.moveTo(Math.cos(a - .26) * .28, Math.sin(a - .26) * .28);
    c.lineTo(Math.cos(a) * .56, Math.sin(a) * .56);
    c.lineTo(Math.cos(a + .26) * .28, Math.sin(a + .26) * .28);
    c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
  const g = c.createRadialGradient(e.x - .1, e.y - .12, .02, e.x, e.y, .34);
  g.addColorStop(0, '#6a7094'); g.addColorStop(.6, '#2a2f4a'); g.addColorStop(1, '#0d1022');
  c.fillStyle = g; c.beginPath(); c.arc(e.x, e.y, .32, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,80,120,.6)'; c.lineWidth = .025;
  c.beginPath(); c.arc(e.x, e.y, .2, 0, Math.PI * 2); c.stroke();
  c.fillStyle = `rgba(255,${80 + blink * 120},${120 + blink * 80},1)`;
  c.beginPath(); c.arc(e.x, e.y, .09, 0, Math.PI * 2); c.fill();
}

function drawWind(c, f) {
  if (f.vis < .02) return;
  const px = -f.dir[1], py = f.dir[0];
  c.lineCap = 'round'; c.lineWidth = .05;
  for (const s of f.streaks) {
    const a0 = s.a, a1 = Math.min(f.len, s.a + .6);
    const x0 = f.x + f.dir[0] * a0 + px * s.c, y0 = f.y + f.dir[1] * a0 + py * s.c;
    const x1 = f.x + f.dir[0] * a1 + px * s.c, y1 = f.y + f.dir[1] * a1 + py * s.c;
    c.strokeStyle = `rgba(120,240,255,${.6 * f.vis * (1 - s.a / f.len)})`;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  }
}
function drawFan(c, f) {
  c.save(); c.translate(f.x, f.y); c.rotate(Math.atan2(f.dir[1], f.dir[0]));
  c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.ellipse(.06, .15, .5, .5, 0, 0, Math.PI * 2); c.fill();
  if (f.vis > .05) glowDot(c, .2, 0, .9, '77,243,255', .25 * f.vis);
  // 本体
  c.fillStyle = '#1f2858'; c.strokeStyle = 'rgba(120,240,255,.6)'; c.lineWidth = .025;
  roundRect(c, -.62, -.32, .4, .64, .1); c.fill(); c.stroke();
  // ランプ（緑=風あり／黄=もうすぐ／赤=止まってる）
  let lamp = '#3dffa0';
  if (f.period && !f.active) lamp = (f.period - fanPhase(f) < .7 && Math.sin(anim * 30) > 0) ? '#ffd23f' : '#ff3b6b';
  c.save(); c.shadowColor = lamp; c.shadowBlur = 8;
  c.fillStyle = lamp; c.beginPath(); c.arc(-.46, 0, .08, 0, Math.PI * 2); c.fill();
  c.restore();
  // ガード
  c.fillStyle = '#121a40'; c.strokeStyle = '#4df3ff'; c.lineWidth = .05;
  c.beginPath(); c.arc(0, 0, .44, 0, Math.PI * 2); c.fill(); c.stroke();
  // 羽根
  c.save(); c.rotate(f.spin); c.fillStyle = `rgba(120,240,255,${.45 + .4 * f.vis})`;
  for (let i = 0; i < 3; i++) {
    c.rotate(Math.PI * 2 / 3);
    c.beginPath(); c.ellipse(.2, 0, .2, .085, .35, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  c.fillStyle = '#e9f1ff'; c.beginPath(); c.arc(0, 0, .07, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(77,243,255,.35)'; c.lineWidth = .02;
  c.beginPath(); c.arc(0, 0, .28, 0, Math.PI * 2); c.stroke();
  c.restore();
}

function drawCat(c, cat) {   // 宇宙ねこ（ヘルメットつき）
  const sleeping = cat.st === 'sleep', tired = cat.st === 'tired', chase = cat.st === 'chase' || cat.st === 'alert';
  const pounce = cat.st === 'pounce';
  const bob = cat.st === 'chase' ? Math.abs(Math.sin(anim * 14)) * .06 : sleeping ? Math.sin(anim * 2) * .02 : 0;
  c.fillStyle = 'rgba(0,0,0,.45)';
  c.beginPath(); c.ellipse(cat.x + .08, cat.y + .4, .55, .28, 0, 0, Math.PI * 2); c.fill();
  if (chase) glowDot(c, cat.x, cat.y, 1.1, '255,80,120', .2);
  c.save(); c.translate(cat.x, cat.y - bob); c.scale(cat.face * 1.15, 1.15);
  const fur = '#f4a24c', dark = '#d97a26';
  // しっぽ
  const wag = Math.sin(anim * (chase ? 10 : 3)) * .25;
  c.strokeStyle = fur; c.lineWidth = .13; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-.28, .25); c.quadraticCurveTo(-.65, .2 + wag, -.55, -.15 + wag); c.stroke();
  // 宇宙服のからだ
  c.fillStyle = '#e8eefc'; c.beginPath(); c.ellipse(-.02, .2, .36, .25, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#4df3ff'; c.fillRect(-.12, .13, .2, .06);
  c.fillStyle = '#ff4fd8'; c.beginPath(); c.arc(.14, .16, .035, 0, Math.PI * 2); c.fill();
  // 足
  c.fillStyle = '#b9c6e6';
  const step = cat.st === 'chase' ? Math.sin(anim * 14) * .05 : 0;
  for (const [fx, ph] of [[-.2, 1], [.18, -1]]) { c.beginPath(); c.ellipse(fx + step * ph, .42, .09, .06, 0, 0, Math.PI * 2); c.fill(); }
  // あたま
  const hy = sleeping ? -.05 : -.15;
  c.fillStyle = fur; c.beginPath(); c.arc(.12, hy, .3, 0, Math.PI * 2); c.fill();
  for (const ex of [-1, 1]) {
    c.fillStyle = fur;
    c.beginPath(); c.moveTo(.12 + ex * .26, hy - .1); c.lineTo(.12 + ex * .22, hy - .42); c.lineTo(.12 + ex * .04, hy - .26); c.fill();
    c.fillStyle = '#ffb7b2';
    c.beginPath(); c.moveTo(.12 + ex * .21, hy - .14); c.lineTo(.12 + ex * .19, hy - .33); c.lineTo(.12 + ex * .09, hy - .24); c.fill();
  }
  c.strokeStyle = dark; c.lineWidth = .045;
  for (const sx of [-.07, .12, .31]) { c.beginPath(); c.moveTo(sx, hy - .29); c.lineTo(sx + (sx - .12) * .15, hy - .17); c.stroke(); }
  // 顔
  c.strokeStyle = '#3a2416'; c.fillStyle = '#3a2416'; c.lineWidth = .04;
  if (sleeping || tired) {
    for (const ex of [.01, .23]) { c.beginPath(); c.arc(ex, hy + .02, .055, .2, Math.PI - .2); c.stroke(); }
  } else {
    const er = chase || pounce ? .075 : .06;
    for (const ex of [.01, .23]) {
      c.fillStyle = '#3a2416'; c.beginPath(); c.arc(ex, hy + .01, er, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + .02, hy - .015, er * .38, 0, Math.PI * 2); c.fill();
    }
  }
  c.fillStyle = '#ff8a8a'; c.beginPath(); c.moveTo(.09, hy + .09); c.lineTo(.15, hy + .09); c.lineTo(.12, hy + .13); c.fill();
  c.strokeStyle = 'rgba(58,36,22,.6)'; c.lineWidth = .025;
  for (const s of [-1, 1]) for (const wy of [.1, .15]) {
    c.beginPath(); c.moveTo(.12 + s * .1, hy + wy); c.lineTo(.12 + s * .34, hy + wy + (wy - .125) * 1.5); c.stroke();
  }
  // ヘルメット
  c.fillStyle = 'rgba(170,225,255,.13)'; c.strokeStyle = 'rgba(200,240,255,.75)'; c.lineWidth = .035;
  c.beginPath(); c.arc(.12, hy - .07, .47, 0, Math.PI * 2); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = .045; c.lineCap = 'round';
  c.beginPath(); c.arc(.12, hy - .07, .38, Math.PI * 1.1, Math.PI * 1.4); c.stroke();
  // アンテナ
  c.strokeStyle = '#b9c6e6'; c.lineWidth = .03;
  c.beginPath(); c.moveTo(.12, hy - .54); c.lineTo(.12, hy - .7); c.stroke();
  c.fillStyle = chase ? '#ff3b6b' : '#4df3ff'; c.beginPath(); c.arc(.12, hy - .72, .05, 0, Math.PI * 2); c.fill();
  // ねこパンチ
  if (pounce) {
    c.fillStyle = '#fff4e6'; c.strokeStyle = dark; c.lineWidth = .03;
    c.beginPath(); c.ellipse(.42, .05, .16, .13, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  c.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawBackground();
  const k = S * dpr;
  ctx.setTransform(k, 0, 0, k, OX * dpr, OY * dpr);

  // 盤のまわりの光と縁
  const fl = open.includes('l') ? 0 : .3, fr = open.includes('r') ? 0 : .3;
  const ft = open.includes('t') ? 0 : .3, fb = open.includes('b') ? 0 : .3;
  ctx.fillStyle = 'rgba(77,243,255,.05)';
  roundRect(ctx, -fl - .5, -ft - .5, COLS + fl + fr + 1, ROWS + ft + fb + 1, .9); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRect(ctx, -fl + .1, -ft + .35, COLS + fl + fr, ROWS + ft + fb, .4); ctx.fill();
  ctx.fillStyle = '#0b1030';
  roundRect(ctx, -fl, -ft, COLS + fl + fr, ROWS + ft + fb, .35); ctx.fill();
  if (open) { ctx.fillStyle = '#070a1e'; ctx.fillRect(0, ROWS, COLS, .25); }   // 盤の厚み

  // 床
  ctx.drawImage(boardC, 0, 0, COLS, ROWS);

  // 縁のネオン（壁のある辺）／壁のない辺は赤い点線
  ctx.save();
  ctx.lineCap = 'round';
  ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 10; ctx.strokeStyle = 'rgba(120,240,255,.9)'; ctx.lineWidth = .05;
  const side = (s, x0, y0, x1, y1) => { if (!open.includes(s)) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); } };
  side('t', -fl, -ft, COLS + fr, -ft); side('b', -fl, ROWS + fb, COLS + fr, ROWS + fb);
  side('l', -fl, -ft, -fl, ROWS + fb); side('r', COLS + fr, -ft, COLS + fr, ROWS + fb);
  ctx.shadowColor = '#ff3b6b'; ctx.strokeStyle = 'rgba(255,70,110,.95)'; ctx.lineWidth = .06;
  ctx.setLineDash([.28, .2]); ctx.lineDashOffset = -anim * .8;
  const edge = (s, x0, y0, x1, y1) => { if (open.includes(s)) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); } };
  edge('l', .03, 0, .03, ROWS); edge('r', COLS - .03, 0, COLS - .03, ROWS);
  edge('t', 0, .03, COLS, .03); edge('b', 0, ROWS - .03, COLS, ROWS - .03);
  ctx.restore();

  // ブラックホール
  L.holes.forEach(([x, y, r], i) => drawBlackHole(ctx, x, y, r, i * 1.7));

  // ワープゲート
  const pulse = 1 + Math.sin(anim * 4) * .08;
  for (const b of balls) if (!b.done) drawGate(ctx, b, pulse);

  // 風
  for (const f of fans) drawWind(ctx, f);

  // ボール
  for (const ball of balls) if (ball.alpha > 0) drawBall(ctx, ball, pulse);

  for (const e of enemies) drawEnemy(ctx, e);
  for (const c of cats) drawCat(ctx, c);

  // 壁（ボールより手前）
  ctx.drawImage(wallC, 0, 0, COLS, ROWS);
  for (const f of fans) drawFan(ctx, f);

  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / .6);
    ctx.fillStyle = p.c; drawStar(ctx, p.x, p.y, .12, p.life * 10); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ねこの吹き出し・文字
  for (const c of cats) {
    if (c.st === 'sleep') textAt(c.x + .55 + Math.sin(anim * 2) * .05, c.y - .9 - (anim % 2) * .15, 'z', .45, '#9fe8ff');
    if (c.st === 'tired') textAt(c.x + .55, c.y - .85, 'ハァ', .32, '#e9f1ff');
  }
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 3);
    textAt(t.x, t.y, t.s, t.s.length > 1 ? .5 : .7, t.col || '#fff');
  }
  ctx.globalAlpha = 1;
}

// ===== ループ =====
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
loadLevel(0);
resize();
showMenu();
requestAnimationFrame(frame);

window.__game = {
  get state() { return state; }, get L() { return L; }, get walls() { return walls; }, get open() { return open; },
  get cats() { return cats; }, get fans() { return fans; }, get balls() { return balls; }, get ball() { return balls[0]; }, sensor, tilt, readyLevel, loadLevel, LEVELS,
  start() { hideCard(); state = 'play'; },
};
})();
</script>
</body>
